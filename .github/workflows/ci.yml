name: CI — Testes Automatizados

on:
  pull_request:
    branches:
      - main

jobs:

  # ══════════════════════════════════════════════
  #  JOB 1 — Testes de Backend (JUnit)
  # ══════════════════════════════════════════════
  testes-backend:
    name: Testes Backend (JUnit)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sqa_social_media
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Rodar todos os testes do backend
        working-directory: ./api
        continue-on-error: true
        run: |
          chmod +x mvnw
          ./mvnw test

      - name: Rodar apenas testes de regressao do backend
        working-directory: ./api
        run: |
          chmod +x mvnw
          ./mvnw test -Dtest="UserServiceTest#testIsPasswordValid_senhaForte_deveRetornarTrue+testIsPasswordValid_semMaiuscula_deveRetornarFalse+testIsPasswordValid_muitoCurta_deveRetornarFalse+testCreateUser_deveRetornarUsuarioCriado+testFindByEmail_naoEncontrado_deveRetornarNull+testFindByEmail_encontrado_deveRetornarUsuario,AuthControllerIntegrationTest#testSignup_novoUsuario_deveRetornar200+testSignup_emailInvalido_deveRetornar422+testSignin_credenciaisCorretas_deveRetornar200+testSignin_credenciaisErradas_deveRetornar401+testResetPassword_emailNaoExiste_deveRetornar404"

  # ══════════════════════════════════════════════
  #  JOB 2 — Testes de Frontend (Jest)
  # ══════════════════════════════════════════════
  testes-frontend:
    name: Testes Frontend (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: ./client
        run: npm install

      - name: Rodar todos os testes do frontend
        working-directory: ./client
        continue-on-error: true
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Rodar apenas testes de regressao que devem passar
        working-directory: ./client
        run: npm test -- --watchAll=false --passWithNoTests --testNamePattern="SUCESSO"

  # ══════════════════════════════════════════════
  #  JOB 3 — Testes de API (Playwright)
  # ══════════════════════════════════════════════
  testes-api:
    name: Testes de API (Playwright)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sqa_social_media
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Configurar credenciais do banco para CI
        working-directory: ./api/src/main/resources
        run: |
          cat > application.properties << 'EOF'
          spring.application.name=demo
          spring.datasource.url=jdbc:mysql://localhost:3306/sqa_social_media
          spring.datasource.username=root
          spring.datasource.password=root
          spring.jpa.hibernate.ddl-auto=update
          spring.jpa.show-sql=false
          EOF

      - name: Iniciar o backend em background
        working-directory: ./api
        run: |
          chmod +x mvnw
          ./mvnw spring-boot:run -DskipTests &
          echo "Aguardando backend iniciar..."
          sleep 40

      - name: Instalar dependências dos testes
        working-directory: ./tests
        run: npm ci

      - name: Dar permissão ao Playwright
        working-directory: ./tests
        run: chmod +x ./node_modules/.bin/playwright

      - name: Instalar Playwright e browsers
        working-directory: ./tests
        run: npx playwright install --with-deps chromium

      - name: Rodar todos os testes de API
        working-directory: ./tests
        continue-on-error: true
        run: npx playwright test src/api.spec.ts --reporter=list

      - name: Rodar apenas testes de API que devem passar
        working-directory: ./tests
        run: npx playwright test src/api.spec.ts --reporter=list --grep "SUCESSO"
