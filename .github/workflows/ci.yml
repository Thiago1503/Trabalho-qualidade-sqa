name: CI — Testes Automatizados

# Gatilho: roda automaticamente em todo Pull Request para a branch main
on:
  pull_request:
    branches:
      - main

jobs:

  # ══════════════════════════════════════════════
  #  JOB 1 — Testes de Backend (JUnit)
  # ══════════════════════════════════════════════
  testes-backend:
    name: Testes Backend (JUnit)
    runs-on: ubuntu-latest

    # Sobe um banco MySQL para os testes de integração
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sqa_social_media
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Rodar testes do backend
        working-directory: ./api
        run: ./mvnw test
        # Os testes de unidade usam H2 em memória
        # Os testes de integração usam o MySQL do service acima

  # ══════════════════════════════════════════════
  #  JOB 2 — Testes de Frontend (Jest)
  # ══════════════════════════════════════════════
  testes-frontend:
    name: Testes Frontend (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: ./client
        run: npm install

      - name: Rodar testes do frontend
        working-directory: ./client
        run: npm test -- --watchAll=false --passWithNoTests

  # ══════════════════════════════════════════════
  #  JOB 3 — Testes E2E e de API (Playwright)
  # ══════════════════════════════════════════════
  testes-e2e:
    name: Testes E2E e API (Playwright)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sqa_social_media
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Configurar credenciais do banco para CI
        working-directory: ./api/src/main/resources
        run: |
          cat > application.properties << 'EOF'
          spring.application.name=demo
          spring.datasource.url=jdbc:mysql://localhost:3306/sqa_social_media
          spring.datasource.username=root
          spring.datasource.password=root
          spring.jpa.hibernate.ddl-auto=update
          spring.jpa.show-sql=false
          EOF

      - name: Compilar e iniciar o backend em background
        working-directory: ./api
        run: |
          ./mvnw spring-boot:run -DskipTests &
          echo "Aguardando backend iniciar..."
          sleep 30

      - name: Instalar dependências do frontend
        working-directory: ./client
        run: npm install

      - name: Iniciar o frontend em background
        working-directory: ./client
        run: |
          npm run build
          npm run start &
          echo "Aguardando frontend iniciar..."
          sleep 15

      - name: Instalar dependências dos testes
        working-directory: ./tests
        run: npm install

      - name: Instalar browsers do Playwright
        working-directory: ./tests
        run: npx playwright install chromium --with-deps

      - name: Rodar testes E2E e de API
        working-directory: ./tests
        run: npx playwright test --reporter=list

      - name: Salvar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
