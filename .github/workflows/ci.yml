name: CI — Testes Automatizados

# Gatilho: roda automaticamente em todo Pull Request para a branch main
on:
  pull_request:
    branches:
      - main

jobs:

  # ══════════════════════════════════════════════
  #  JOB 1 — Testes de Backend (JUnit)
  # ══════════════════════════════════════════════
  testes-backend:
    name: Testes Backend (JUnit)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sqa_social_media
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Rodar testes do backend
        working-directory: ./api
        # continue-on-error: permite que testes de bug (que falham intencionalmente)
        # não impeçam a pipeline de continuar
        continue-on-error: true
        run: |
          chmod +x mvnw
          ./mvnw test

      - name: Verificar resultado dos testes
        working-directory: ./api
        run: |
          chmod +x mvnw
          ./mvnw test -Dtest="UserServiceTest#testIsPasswordValid*+testCreateUser*+testFindByEmail*,AuthControllerIntegrationTest#testSignup_novoUsuario*+testSignup_emailInvalido*+testSignin_credenciaisCorretas*+testSignin_credenciaisErradas*+testResetPassword*" 2>&1 | tail -5

  # ══════════════════════════════════════════════
  #  JOB 2 — Testes de Frontend (Jest)
  # ══════════════════════════════════════════════
  testes-frontend:
    name: Testes Frontend (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: ./client
        run: npm install

      - name: Rodar testes do frontend
        working-directory: ./client
        # Os testes de bug falham intencionalmente — isso é esperado
        continue-on-error: true
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Rodar apenas testes de regressão (devem passar)
        working-directory: ./client
        run: npm test -- --watchAll=false --passWithNoTests --testPathPattern="components|integration" --testNamePattern="SUCESSO"

  # ══════════════════════════════════════════════
  #  JOB 3 — Testes de API (Playwright - apenas API)
  # ══════════════════════════════════════════════
  testes-api:
    name: Testes de API (Playwright)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sqa_social_media
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Configurar credenciais do banco para CI
        working-directory: ./api/src/main/resources
        run: |
          cat > application.properties << 'EOF'
          spring.application.name=demo
          spring.datasource.url=jdbc:mysql://localhost:3306/sqa_social_media
          spring.datasource.username=root
          spring.datasource.password=root
          spring.jpa.hibernate.ddl-auto=update
          spring.jpa.show-sql=false
          EOF

      - name: Iniciar o backend em background
        working-directory: ./api
        run: |
          chmod +x mvnw
          ./mvnw spring-boot:run -DskipTests &
          echo "Aguardando backend iniciar..."
          sleep 40

      - name: Instalar dependências dos testes
        working-directory: ./tests
        run: npm install

      - name: Instalar browsers do Playwright
        working-directory: ./tests
        run: npx playwright install chromium --with-deps

      - name: Rodar apenas testes de API (sem E2E)
        working-directory: ./tests
        # O teste de bug da mensagem falha intencionalmente
        continue-on-error: true
        run: npx playwright test src/api.spec.ts --reporter=list

      - name: Verificar testes de API que devem passar
        working-directory: ./tests
        run: npx playwright test src/api.spec.ts --reporter=list --grep "SUCESSO"
